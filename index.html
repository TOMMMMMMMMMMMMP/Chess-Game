<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chess Game</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="app">

    <!-- Board -->
    <div class="board-wrapper">
      <div class="board-labels-top"></div>
      <div class="board-container">
        <div class="board-labels-left"></div>
        <div id="board" class="board"></div>
      </div>
    </div>

    <!-- Side panel -->
    <div class="side-panel">

      <div class="turn-indicator" id="turn-indicator">
        ⬜ White's turn
      </div>

      <div class="panel-section">
        <h3>Captured by White</h3>
        <div id="captured-white" class="captured"></div>
      </div>

      <div class="panel-section">
        <h3>Captured by Black</h3>
        <div id="captured-black" class="captured"></div>
      </div>

      <div class="panel-section">
        <h3>Move History</h3>
        <div id="move-history" class="move-history"></div>
      </div>

      <button id="restart-btn" class="restart-btn">↺ Restart</button>

    </div>
  </div>

  <script src="js/pieces/Piece.js"></script>
  <script src="js/pieces/King.js"></script>
  <script src="js/pieces/Queen.js"></script>
  <script src="js/pieces/Rook.js"></script>
  <script src="js/pieces/Bishop.js"></script>
  <script src="js/pieces/Knight.js"></script>
  <script src="js/pieces/Pawn.js"></script>
  <script src="js/board.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
